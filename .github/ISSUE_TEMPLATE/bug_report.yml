name: Bug Report
description: Report a problem with Active Goals
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Active Goals!
        Please provide as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: What went wrong?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce the problem?
      placeholder: |
        1. Open Active Goals
        2. Select...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Active Goals Version
      placeholder: e.g. 2.1.12

  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or Logs
      description: Remove private information before posting.

  - type: textarea
    id: additional
    attributes:
      label: Additional Information
