name: Feature Request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for Active Goals?
        Tell us how it would improve the plugin.

  - type: textarea
    id: problem
    attributes:
      label: Problem or Limitation
      description: What problem would this solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Feature
      description: Describe what you would like added.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered other solutions?

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add examples, screenshots, or mockups.
